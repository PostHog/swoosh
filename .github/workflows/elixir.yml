name: Elixir CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.elixir }}, ${{ matrix.otp }}${{ matrix.lint && ', lint' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { elixir: "1.16", otp: "26.x" }
          - { elixir: "1.16", otp: "27.x" }
          - { elixir: "1.17", otp: "26.x" }
          - { elixir: "1.17", otp: "27.x" }
          - { elixir: "1.18", otp: "26.x" }
          - { elixir: "1.18", otp: "27.x" }
          - { elixir: "1.19", otp: "28.x" }
          - { elixir: "1.20", otp: "29.x", lint: true }
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      - run: mix format --check-formatted
        if: ${{ matrix.lint }}

      - run: mix deps.unlock --check-unused
        if: ${{ matrix.lint }}

      - run: mix test
