name: Spellcheck

on: push

jobs:
  spellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Spell check
        run: |
          pip install codespell    
          codespell -S deps,_build,.git,.elixir_ls -L Domin,checkin -r "(?<!@)\\b[a-zA-Z0-9_'-]+\\b"
